name: I have an idea
description: A feature, a skill, an app to connect, or a better way to do something.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the job, not the solution. Who needs this and when?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like OpenLobs to do?
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options: ["Yes, I would like to try", "Yes, with some guidance", "No, I am only suggesting it"]
