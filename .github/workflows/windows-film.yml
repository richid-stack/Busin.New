name: windows-film

# Throwaway: builds the OpenLobs Bridge installer on GitHub's Windows machine, then films a person installing it: the cursor, the typing,
# every wizard page, the tray icon, the Start menu folder and the status window. Saves the recording to the branch "windows-films".
on:
  workflow_dispatch:
  push:
    branches: [phase9/landing-videos]
    paths: ['.github/workflows/windows-film.yml', 'scripts/win-film.ps1', 'scripts/windows-film.mts']

permissions:
  contents: write

jobs:
  film:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find ffmpeg
        shell: pwsh
        run: |
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) { choco install ffmpeg -y --no-progress; $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue }
          if (-not $ff) { $found = Get-ChildItem 'C:\ProgramData\chocolatey\bin','C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1; if ($found) { "FFMPEG=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 } else { throw "ffmpeg was not found" } } else { "FFMPEG=$($ff.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: Build the app folder
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          node scripts/ci-capture.mjs "build app folder" node bridge/installer/build.mjs --node $node
      - name: Find Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: |
          $log = & $env:ISCC "/DAppVersion=0.6.0" "/DDefaultServer=" bridge\installer\openlobs-bridge.iss 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-Item dist\OpenLobs-Bridge-Setup.exe | Select-Object Name, Length
      - name: Film the installation
        run: npx tsx scripts/windows-film.mts
      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-film
          path: films
          if-no-files-found: warn
      - name: Save the recording to the windows-films branch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/s" && mkdir "$RUNNER_TEMP/s" && cp -r films/. "$RUNNER_TEMP/s/" 2>/dev/null || true
          cd "$RUNNER_TEMP/s" && git init -q -b windows-films && git config user.name "windows-film" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Recording from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" windows-films
