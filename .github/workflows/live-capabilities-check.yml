name: live-capabilities-check

# Real capability check on GitHub's machines: a workflow built and run from chat, photos found and saved, a many-file build,
# a task started and finished, a schedule that fires on time, and an agent proposed and saved. Real models (Gemini first, then Groq),
# Firebase emulators for sign-in and data, so no real accounts are touched. Keys come from repository secrets and are never printed.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Which checks to run (comma separated)'
        required: false
        default: 'photos,build,task,schedule,agent'
      models:
        description: 'Models to try, in order (comma separated)'
        required: false
        default: 'google/gemini-3.8-flash,google/gemini-3.5-flash,google/gemini-3.1-flash-lite,groq/gpt-oss-120b,groq/gpt-oss-20b,groq/qwen3.8-27b'

permissions:
  contents: read

jobs:
  live-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      LIVE_SCENARIOS: ${{ github.event.inputs.scenarios || 'photos,build,task,schedule,agent' }}
      CRON_SECRET: live-check-cron-secret-0123456789
      LIVE_OUT: live-capabilities-output
      LIVE_MODELS: ${{ github.event.inputs.models || 'google/gemini-3.8-flash,google/gemini-3.5-flash,google/gemini-3.1-flash-lite,groq/gpt-oss-120b,groq/gpt-oss-20b,groq/qwen3.8-27b' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Point the app at the emulators (this file is not committed back)
        run: |
          cat > firebase-applet-config.json <<'JSON'
          { "projectId": "demo-openlobs", "apiKey": "demo", "authDomain": "demo-openlobs.firebaseapp.com", "firestoreDatabaseId": "(default)", "appId": "demo" }
          JSON
      - name: Live chats
        run: npx --yes firebase-tools@15 emulators:exec --only auth,firestore --project demo-openlobs --config firebase.emulator.json "node scripts/live-capabilities-check.mjs"
      - name: Keep what the chats made
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-capabilities-output
          path: live-capabilities-output
          if-no-files-found: ignore
