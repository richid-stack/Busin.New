name: live-chat-tour

# Opens the real app in a real browser, signs in with Google's local test emulators, sends a simple chat and a simple
# workflow request to a real model (Groq, from the GROQ_API_KEY repository secret) and saves screenshots to the
# branch "live-tour". Start it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Which half of the tour: 1 or 2'
        default: '1'
  push:
    branches: [ci/live-tour]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Point the app at the emulators (this file is not committed back)
        run: |
          cat > firebase-applet-config.json <<'JSON'
          { "projectId": "demo-openlobs", "apiKey": "demo", "authDomain": "demo-openlobs.firebaseapp.com", "firestoreDatabaseId": "(default)", "appId": "demo" }
          JSON
      - name: Browser run
        run: npx --yes firebase-tools@15 emulators:exec --only auth,firestore --project demo-openlobs --config firebase.emulator.json "TOUR_SET=${{ inputs.set || 1 }} node scripts/live-chat-tour.mjs"
      - name: Save the screenshots to the live-tour branch
        if: always()
        run: |
          rm -rf /tmp/shots && mkdir /tmp/shots && cp -r shots/. /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q -b live-tour && git config user.name "live-chat-shots" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-tour
