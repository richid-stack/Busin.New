name: landing-films

# Throwaway: runs the real app against real models (Gemini from the GEMINI_API_KEY repository secret) and films two scenes for the landing
# page: an idea turned into a working project, and a specialist doing a research job. Sign-in uses Google's local test emulators, so no
# real accounts or data are touched. Saves the recordings to the branch "landing-films".
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Scenes to film (comma separated)'
        required: false
        default: 'project,specialist'
  push:
    branches: [phase9/landing-videos]
    paths: ['.github/workflows/landing-films.yml', 'scripts/landing-films.cjs']

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FILM_SCENES: ${{ github.event.inputs.scenes || 'project,specialist' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Point the app at the emulators (this file is not committed back)
        run: |
          cat > firebase-applet-config.json <<'JSON'
          { "projectId": "demo-openlobs", "apiKey": "demo", "authDomain": "demo-openlobs.firebaseapp.com", "firestoreDatabaseId": "(default)", "appId": "demo" }
          JSON
      - name: Film the scenes
        run: npx --yes firebase-tools@15 emulators:exec --only auth,firestore --project demo-openlobs --config firebase.emulator.json "node scripts/landing-films.cjs"
      - name: Save the recordings to the landing-films branch
        if: always()
        run: |
          rm -rf /tmp/films && mkdir /tmp/films && cp -r films/. /tmp/films/ 2>/dev/null || true
          cd /tmp/films && git init -q -b landing-films && git config user.name "landing-films" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Recordings from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" landing-films
