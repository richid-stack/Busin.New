name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Icon bundle is up to date
        run: npm run icons && git diff --exit-code src/generated/icons.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: node scripts/ci-capture.mjs "npm test" npm test

      # The build writes auto-imports.d.ts and components.d.ts, which the type check reads, so it runs first.
      - name: Build
        run: npx vite build

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck server
        run: npm run typecheck:server
