name: keys-check

# Calls each provider with its real key and reports what worked. Start it by hand from the Actions tab.
# Keys are read from repository secrets and are never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_LICENSE }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/keys-check.mts
