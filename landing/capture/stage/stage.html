<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --ink:#000; --ln:#1c1c1c; --mu:#8c8c8c; --blue:#09f; --violet:#8b5cf6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; background: var(--ink); overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: .55; }
  .g1 { inset: 0; width: auto; height: auto; border-radius: 0; filter: none; opacity: 1; background: radial-gradient(circle at var(--mx, 50%) 0%, rgba(0,153,255,.22), transparent 62%); }
  .g2 { display: none; }
  .dots { display: none; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
  .abs { position: absolute; }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; will-change: transform, opacity, filter; }
  .coral { background: linear-gradient(90deg, #09f, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo { position: absolute; will-change: transform, opacity; }
  .chip { position: absolute; padding: 18px 34px; border-radius: 999px; font-weight: 500; font-size: 38px; letter-spacing: -0.03em; background: #111; border: 1px solid #232323; white-space: nowrap; will-change: transform, opacity; }
  .shot { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 50px 120px -30px rgba(0,0,0,.9), 0 0 0 1px #262626; background: #000; will-change: transform, opacity; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .phone { border-radius: 54px; box-shadow: 0 50px 120px -20px rgba(0,0,0,.8), 0 0 0 10px #101010, 0 0 0 11px #2a2a2a; }
  .cap { position: absolute; font-weight: 500; letter-spacing: -0.05em; will-change: transform, opacity; }
  /* tutorial pieces */
  .term { position: absolute; background: #0a0a0a; border-radius: 22px; box-shadow: 0 50px 120px -30px rgba(0,0,0,.9), 0 0 0 1px #262626; overflow: hidden; }
  .term .bar { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #111; font: 500 20px Inter; color: #777; }
  .term .bar i { width: 14px; height: 14px; border-radius: 50%; background: #2a2a2a; display: block; }
  .term pre { font: 500 34px/1.55 'DejaVu Sans Mono', monospace; padding: 34px 40px; color: #e8eaf2; white-space: pre-wrap; }
  .term .p { color: #59e07a; } .term .c { color: #666; } .term .k { color: #7fb0ff; }
  .caret { display: inline-block; width: 18px; height: 34px; background: #e8eaf2; vertical-align: -6px; margin-left: 2px; }
  .stepno { position: absolute; font-weight: 300; letter-spacing: -0.06em; }
  .note { position: absolute; font-weight: 500; color: rgba(255,255,255,.62); letter-spacing: -0.01em; }
  .card { position: absolute; border-radius: 26px; background: #050505; color: #fff; border: 1px solid #1c1c1c; box-shadow: 0 50px 120px -30px rgba(0,0,0,.9); }
</style></head>
<body>
<div class="bg" id="bg"><div class="glow g1" id="g1"></div><div class="glow g2" id="g2"></div><div class="dots"></div><div class="vig"></div></div>
<div id="root"></div>
<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo3 = x => 1 - Math.pow(1 - x, 3)
const eo5 = x => 1 - Math.pow(1 - x, 5)
const ei3 = x => x * x * x
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const root = document.getElementById('root'), g1 = document.getElementById('g1'), g2 = document.getElementById('g2')
const LOGO = '<img src="logo.svg" style="width:100%;height:100%">'
// The glow never moves: every scene (and the edited footage) sits on the same background, so cuts never jump.
function ambient() {
  g1.style.setProperty('--mx', '50%')
}
const scenes = {}

/* ---------- intro: three beats ---------- */
scenes.intro = { dur: 3.0, build() {
  const w = ['Delegate.', 'Verify.', 'Approve.']
  this.w = w.map((s, i) => { const e = $(`<div class="word ${i === 2 ? 'coral' : ''}" style="top:${i === 2 ? 392 : 400}px;font-size:${i === 1 ? 200 : 230}px">${s}</div>`); root.appendChild(e); return e })
  this.logo = $(`<div class="logo" style="left:60px;top:54px;width:70px;height:70px">${LOGO}</div>`); root.appendChild(this.logo)
  this.name = $(`<div class="abs" style="left:146px;top:62px;font-weight:600;font-size:40px;letter-spacing:-.04em">OpenLobs</div>`); root.appendChild(this.name)
}, draw(t) {
  ambient(t)
  this.w.forEach((e, i) => {
    const a = i * 1.0, p = seg(t, a, a + .34), o = seg(t, a + .78, a + 1.0)
    const last = i === 2
    const s = .72 + .28 * back(p)
    const out = last ? 0 : eo3(o)
    const xo = last ? -eo3(seg(t, 2.7, 3.0)) * 420 : 0
    e.style.opacity = clamp(p * 2) * (1 - out) * (last ? 1 - seg(t, 2.8, 3.0) : 1)
    e.style.transform = `translate(${xo}px, ${(1 - eo5(p)) * 80 - out * 60}px) scale(${s + out * .12})`
    e.style.filter = `blur(${(1 - p) * 22 + out * 16}px)`
  })
  const lp = seg(t, .1, .6); this.logo.style.opacity = lp; this.name.style.opacity = lp
  this.logo.style.transform = `rotate(${(1 - eo3(lp)) * -25}deg) scale(${.6 + .4 * back(lp)})`
}}

/* ---------- montage: light, dark, phone ---------- */
scenes.bg = { dur: 1, build() {}, draw(t) { ambient() } }
scenes.montage = { dur: 4.0, build() {
  const mk = (src, l, t, w, h, cls = '') => { const e = $(`<div class="shot ${cls}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><img src="../../media/shots/${src}.webp"></div>`); root.appendChild(e); return e }
  this.a = mk('tasks-light', 120, 190, 1120, 700)
  this.b = mk('workflow-canvas-dark', 520, 130, 1120, 700)
  this.c = mk('m-chat-trace-dark', 1330, 130, 380, 822, 'phone')
  this.t1 = $(`<div class="cap" style="left:120px;top:90px;font-size:82px">Light theme.</div>`); this.t2 = $(`<div class="cap" style="left:120px;top:90px;font-size:82px;color:#fff">Dark theme.</div>`); this.t3 = $(`<div class="cap coral" style="left:120px;top:90px;font-size:82px">On mobile.</div>`)
  ;[this.t1, this.t2, this.t3].forEach(e => root.appendChild(e))
}, draw(t) {
  ambient(t, 2)
  const pa = seg(t, 0, .6), pb = seg(t, 1.2, 1.85), pc = seg(t, 2.35, 3.0), end = seg(t, 3.6, 4.0)
  const slide = (e, p, fromX, toX, y, rot = 0, sc = 1) => { e.style.opacity = clamp(p * 3) * (1 - end); e.style.transform = `translate(${fromX + (toX - fromX) * eo5(p)}px, ${y + end * 40}px) rotate(${rot * eo3(p)}deg) scale(${sc})` }
  slide(this.a, pa, 1500, 0, (1 - eo3(pa)) * 40 - 20 * seg(t, 0, 4), -1.2)
  slide(this.b, pb, 1500, 120, 190 - 190 + 90 * seg(t, 1.2, 4) - 40, 1.4)
  slide(this.c, pc, 900, 0, (1 - eo3(pc)) * 120, 2.2)
  const cap = (e, a, b) => { const p = seg(t, a, a + .3), q = seg(t, b - .25, b); e.style.opacity = p * (1 - q); e.style.transform = `translateY(${(1 - eo5(p)) * 40 - q * 30}px)`; e.style.filter = `blur(${(1 - p) * 10 + q * 8}px)` }
  cap(this.t1, .1, 1.3); cap(this.t2, 1.3, 2.45); cap(this.t3, 2.45, 3.85)
}}

/* ---------- outro: logo + promise ---------- */
scenes.outro = { dur: 5.0, build() {
  this.logo = $(`<div class="logo" style="left:${960 - 90}px;top:210px;width:180px;height:180px">${LOGO}</div>`); root.appendChild(this.logo)
  this.name = $(`<div class="word" style="top:420px;font-size:170px">OpenLobs</div>`); root.appendChild(this.name)
  this.tag = $(`<div class="word" style="top:610px;font-size:62px;letter-spacing:-0.035em;color:rgba(255,255,255,.88)">An assistant that checks its work and asks first.</div>`); root.appendChild(this.tag)
  const items = ['Free to start', 'Open source', 'Bring your own keys', 'Runs on your computer']
  const widths = [330, 310, 450, 530], gap = 26, total = widths.reduce((a, b) => a + b, 0) + gap * 3
  let x = 960 - total / 2
  this.chips = items.map((s, i) => { const e = $(`<div class="chip" style="left:${x}px;top:790px;width:${widths[i]}px;text-align:center">${s}</div>`); x += widths[i] + gap; root.appendChild(e); return e })
}, draw(t) {
  ambient(t, 4)
  const lp = seg(t, 0, .7)
  this.logo.style.opacity = clamp(lp * 2)
  this.logo.style.transform = `translateY(${(1 - eo5(lp)) * -260}px) scale(${.5 + .5 * back(lp)}) rotate(${(1 - eo3(lp)) * 20}deg)`
  const np = seg(t, .45, 1.0); this.name.style.opacity = np; this.name.style.transform = `translateY(${(1 - eo5(np)) * 70}px)`; this.name.style.filter = `blur(${(1 - np) * 20}px)`
  const tp = seg(t, 1.3, 1.9); this.tag.style.opacity = tp; this.tag.style.transform = `translateY(${(1 - eo5(tp)) * 40}px)`
  this.chips.forEach((e, i) => { const p = seg(t, 2.0 + i * .25, 2.35 + i * .25); e.style.opacity = p; e.style.transform = `translateY(${(1 - back(p)) * 60}px) scale(${.85 + .15 * back(p)})` })
  const fo = seg(t, 4.55, 5.0); root.style.opacity = 1 - fo
}}

/* ---------- tag: a short sign-off for the feature clips ---------- */
scenes.tag = { dur: 2.5, build() {
  this.logo = $(`<div class="logo" style="left:${960 - 70}px;top:330px;width:140px;height:140px">${LOGO}</div>`); root.appendChild(this.logo)
  this.name = $(`<div class="word" style="top:500px;font-size:130px">OpenLobs</div>`); root.appendChild(this.name)
  this.line = $(`<div class="word" style="top:670px;font-size:44px;font-weight:400;color:rgba(255,255,255,.7);letter-spacing:-0.03em">Open source · Bring your own keys · Runs on your computer</div>`); root.appendChild(this.line)
}, draw(t) {
  ambient()
  const lp = seg(t, 0, .5); this.logo.style.opacity = clamp(lp * 2); this.logo.style.transform = `translateY(${(1 - eo5(lp)) * -160}px) scale(${.6 + .4 * back(lp)})`
  const np = seg(t, .25, .75); this.name.style.opacity = np; this.name.style.transform = `translateY(${(1 - eo5(np)) * 50}px)`; this.name.style.filter = `blur(${(1 - np) * 14}px)`
  const tp = seg(t, .7, 1.2); this.line.style.opacity = tp; this.line.style.transform = `translateY(${(1 - eo5(tp)) * 30}px)`
  root.style.opacity = 1 - seg(t, 2.25, 2.5)
}}


/* ---------- tutorials: step cards with typed commands (illustrated; the commands are the ones in the README) ---------- */
function stepsScene(spec) {
  const total = spec.title ? spec.titleDur : 0
  const steps = []; let at = total
  spec.steps.forEach(st => { steps.push({ ...st, at, end: at + st.dur }); at += st.dur })
  return { dur: spec.tail ? at + spec.tail : at, build() {
    this.head = $(`<div class="abs" style="left:0;right:0;top:420px;text-align:center"><div class="word" style="position:relative;font-size:104px">${spec.title || ''}</div><div class="note" style="position:relative;margin-top:34px;font-size:42px">${spec.sub || ''}</div></div>`); root.appendChild(this.head)
    this.no = $(`<div class="stepno coral" style="left:120px;top:210px;font-size:340px;line-height:1"></div>`); root.appendChild(this.no)
    this.ttl = $(`<div class="abs" style="left:128px;top:560px;width:720px;font-weight:500;font-size:68px;letter-spacing:-.05em;line-height:1.05"></div>`); root.appendChild(this.ttl)
    this.nt = $(`<div class="note" style="left:128px;top:740px;width:700px;font-size:34px;line-height:1.4"></div>`); root.appendChild(this.nt)
    this.prog = $(`<div class="abs" style="left:128px;top:96px;display:flex;gap:12px"></div>`); root.appendChild(this.prog)
    this.dots = Array.from({ length: spec.count || spec.steps.length }, () => { const d = $(`<div style="width:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)"></div>`); this.prog.appendChild(d); return d })
    this.term = $(`<div class="term" style="left:930px;top:200px;width:880px;height:640px"><div class="bar"><i></i><i></i><i></i><span style="margin-left:14px">${spec.termTitle || 'Terminal'}</span></div><pre></pre></div>`); root.appendChild(this.term)
    this.pre = this.term.querySelector('pre')
    this.list = $(`<div class="card" style="left:930px;top:200px;width:880px;height:640px;padding:46px 54px"></div>`); root.appendChild(this.list)
    this.foot = $(`<div class="note" style="left:0;right:0;bottom:46px;text-align:center;font-size:26px;color:rgba(255,255,255,.5)">${spec.foot || ''}</div>`); root.appendChild(this.foot)
    this.shot = spec.shot ? $(`<div class="shot" style="left:300px;top:150px;width:1320px;height:780px;background:#000"><div style="height:60px;background:#0e0e0e;display:flex;align-items:center;padding:0 22px;gap:10px"><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><div style="margin-left:20px;flex:1;height:34px;border-radius:17px;background:#181818;color:#888;font:500 22px Inter;display:flex;align-items:center;padding:0 18px">${spec.shot.url}</div></div><img src="../../media/shots/${spec.shot.img}.webp" style="display:block;width:100%;height:720px;object-fit:cover;object-position:top left"></div>`) : null
    if (this.shot) root.appendChild(this.shot)
  }, draw(t) {
    ambient()
    const inTitle = spec.title && t < total
    this.head.style.opacity = inTitle ? clamp(seg(t, .15, .7)) * (1 - seg(t, total - .4, total)) : 0
    this.head.style.transform = `translateY(${inTitle ? (1 - eo5(seg(t, .15, .7))) * 40 : 0}px)`
    const cur = steps.find(s => t >= s.at && t < s.end)
    const show = !!cur && !cur.shot
    ;[this.no, this.ttl, this.nt, this.term, this.list, this.prog].forEach(e => e.style.display = show ? 'block' : 'none')
    this.prog.style.display = show ? 'flex' : 'none'
    this.foot.style.opacity = show || inTitle ? 1 : 0
    if (this.shot) { const ss = steps.find(s => s.shot); const on = ss && t >= ss.at && t < ss.end; this.shot.style.display = on ? 'block' : 'none'; if (on) { const p = seg(t, ss.at, ss.at + .6), q = seg(t, ss.end - .35, ss.end); this.shot.style.opacity = p * (1 - q); this.shot.style.transform = `translateY(${(1 - eo5(p)) * 70}px) scale(${.96 + .04 * eo5(p)})` } }
    if (!show) return
    const i = steps.indexOf(cur), lt = t - cur.at
    const gi = i + (spec.offset || 0)
    this.dots.forEach((d, k) => d.style.background = k < gi ? 'rgba(0,153,255,.5)' : k === gi ? '#09f' : 'rgba(255,255,255,.18)')
    this.no.textContent = cur.no; this.ttl.textContent = cur.title; this.nt.textContent = cur.note || ''
    const a = eo5(seg(lt, 0, .45))
    ;[this.no, this.ttl, this.nt].forEach((e, k) => { e.style.opacity = a; e.style.transform = `translateY(${(1 - a) * (30 + k * 10)}px)` })
    const out = seg(lt, cur.dur - .3, cur.dur)
    this.term.style.opacity = this.list.style.opacity = (1 - out) * clamp(lt * 4)
    this.term.style.transform = this.list.style.transform = `translateX(${(1 - eo5(seg(lt, 0, .5))) * 90 - out * 60}px)`
    if (cur.kind === 'list') {
      this.term.style.display = 'none'; this.list.style.display = 'block'
      this.list.innerHTML = (cur.items || []).map((it, k) => { const p = seg(lt, .6 + k * .5, 1.0 + k * .5); return `<div style="display:flex;gap:20px;align-items:flex-start;margin-bottom:30px;opacity:${p};transform:translateY(${(1 - eo5(p)) * 20}px)"><div style="flex:none;width:44px;height:44px;border-radius:50%;background:#09f;color:#fff;font-weight:500;font-size:26px;display:flex;align-items:center;justify-content:center;margin-top:4px">${k + 1}</div><div style="font-size:35px;line-height:1.3;font-weight:400;letter-spacing:-.03em">${it}</div></div>` }).join('')
    } else {
      this.list.style.display = 'none'
      // typed command lines, then a blinking caret
      let out_ = '', clock = .7
      for (const ln of cur.lines) {
        if (ln.c) { out_ += `<span class="c">${ln.c}</span>\n`; continue }
        const n = Math.floor(Math.max(0, Math.min(ln.cmd.length, (lt - clock) * 30))); clock += ln.cmd.length / 30 + .35
        out_ += `<span class="p">$ </span>${ln.cmd.slice(0, n).replace(/</g, '&lt;')}${n < ln.cmd.length || ln === cur.lines[cur.lines.length - 1] ? '<span class="caret" style="opacity:' + (Math.floor(t * 2.2) % 2 ? 0.15 : 1) + '"></span>' : ''}\n`
        if (n < ln.cmd.length) break
      }
      this.pre.innerHTML = out_
    }
  } }
}
/* ---------- a VS Code window, drawn from a timeline: clone, install, configure, run (illustrated; the commands and output follow the README) ---------- */

function vscodeScene(spec) {
  const ev = []; let c = 0; const caps = [], cams = [], acts = []
  const P = {
    at: x => { c = x }, wait: s => { c += s },
    cap: (text, dur) => { caps.push({ a: c, b: c + dur, text }) },
    cam: (s, cx, cy) => cams.push({ t: c, s, cx, cy }),
    act: fn => acts.push({ t: c, k: fn }),
    cmd: (text, o = {}) => { const cps = o.cps || 24, pre = o.pre ?? .5, dur = text.length / cps; c += pre; ev.push({ t: c, type: 'cmd', text, dur }); c += dur + (o.post ?? .4) },
    out: (lines, gap = .09) => { lines.forEach(l => { ev.push({ t: c, type: 'out', text: l }); c += gap }) },
    prog: (fn, dur) => { ev.push({ t: c, type: 'prog', fn, dur }); c += dur + .12 },
    spin: (label, dur) => { ev.push({ t: c, type: 'spin', label, dur }); c += dur }
  }
  spec.timeline(P)
  const total = c + (spec.tail ?? 1.2)
  const TS = spec.titleDur || 0
  return { dur: Math.ceil((TS + total) * 2) / 2, build() {
    this.head = $(`<div class="abs" style="left:0;right:0;top:420px;text-align:center"><div class="word" style="position:relative;font-size:104px">${spec.title}</div><div class="note" style="position:relative;margin-top:34px;font-size:42px">${spec.sub || ''}</div></div>`); root.appendChild(this.head)
    this.cam = $(`<div class="vsx"></div>`); root.appendChild(this.cam)
    this.cam.innerHTML = `<div class="vw" id="vw"><div class="vt"><div class="w"><span style="display:flex;align-items:center">${ICO.files.replace('<svg', '<svg width="18" height="18"')}</span><span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Run</span><span>Terminal</span><span>Help</span></div><div class="c" id="vtt">Visual Studio Code</div><div style="display:flex;gap:26px;font-size:15px;color:#9d9d9d;position:relative;z-index:1"><span>–</span><span>□</span><span>✕</span></div></div>
      <div class="vb"><i class="on">${ICO.files}</i><i>${ICO.search}</i><i>${ICO.git}</i><i>${ICO.run}</i><i>${ICO.ext}</i></div>
      <div class="vs2"><h6>Explorer</h6><div id="vex"></div></div>
      <div class="ve" id="ve"><div class="vtab" id="vtab"></div><div class="vc" id="vcode"></div></div>
      <div class="vp" id="vp"><div class="th"><span>Problems</span><span>Output</span><span>Debug console</span><b>Terminal</b></div><pre id="vpre"></pre></div>
      <div class="vst"><div><span id="vbr">⎇ main</span><span>⊗ 0  ⚠ 0</span></div><div><span>Node 22</span><span>UTF-8</span><span>LF</span><span>PowerShell</span></div></div></div>
      <div class="vbr" id="vbr2" style="display:none"><div class="tb"><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><i style="width:14px;height:14px;border-radius:50%;background:#2a2a2a;display:block"></i><div class="ad">localhost:3000</div></div><img src="../../media/shots/home-dark.webp"></div>`
    this.cap = $(`<div class="cap" style="left:0;right:0;top:978px;text-align:center;font-size:58px;line-height:1.15"></div>`); root.appendChild(this.cap)
    this.v = { pre: this.cam.querySelector('#vpre'), ex: this.cam.querySelector('#vex'), tab: this.cam.querySelector('#vtab'), code: this.cam.querySelector('#vcode'), win: this.cam.querySelector('#vw'), br: this.cam.querySelector('#vbr2'), tt: this.cam.querySelector('#vtt') }
  }, draw(t) {
    ambient()
    const intro = TS && t < TS
    this.head.style.opacity = intro ? clamp(seg(t, .15, .7)) * (1 - seg(t, TS - .4, TS)) : 0
    this.head.style.transform = `translateY(${intro ? (1 - eo5(seg(t, .15, .7))) * 40 : 0}px)`
    const T = t - TS, vis = T >= -.3
    this.cam.style.opacity = vis ? clamp(seg(T, -.3, .5)) : 0
    // camera
    let s = 1, cx = 960, cy = 500
    cams.forEach((k, i) => { const f = i ? cams[i - 1] : k; const p = eio(seg(T, k.t, k.t + 1)); if (T >= k.t || !i) { s = f.s + (k.s - f.s) * p; cx = f.cx + (k.cx - f.cx) * p; cy = f.cy + (k.cy - f.cy) * p } })
    this.cam.style.transform = `translate(960px,500px) scale(${s}) translate(${-cx}px,${-cy}px)`
    // state from actions
    const st = { brt: 0, tree: false, tabs: [], active: '', code: [], cwd: 'C:\\Users\\Ama\\Projects', browser: false, title: 'Visual Studio Code', branch: false }
    acts.forEach(a => { if (a.t <= T) a.k(st, T - a.t) })
    // terminal
    const lines = []
    let cwd = spec.cwd0
    ev.forEach(e => { if (e.t > T) return
      if (e.type === 'cmd') { const n = Math.min(e.text.length, Math.floor((T - e.t) * e.text.length / e.dur)); const done = n >= e.text.length
        lines.push(`<span class="g">PS ${cwd}&gt;</span> ${e.text.slice(0, n).replace(/</g, '&lt;')}${done ? '' : '<span class="car"></span>'}`)
        if (done && /^cd /.test(e.text)) { const d = e.text.slice(3).trim(); cwd = cwd + '\\' + d } }
      else if (e.type === 'out') lines.push(e.text)
      else if (e.type === 'prog') lines.push(e.fn(clamp((T - e.t) / e.dur)))
      else if (e.type === 'spin') { const u = clamp((T - e.t) / e.dur); lines.push(u < 1 ? `<span class="b">${'⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'[Math.floor(T * 12) % 10]}</span> ${e.label}` : `<span class="ok">✓</span> ${e.label}`) } })
    const last = ev.filter(e => e.t <= T).slice(-1)[0]
    const idle = !last || (last.type === 'cmd' ? (T - last.t) >= last.dur : last.type === 'out' || (last.type === 'prog' && T - last.t > last.dur) || (last.type === 'spin' && T - last.t > last.dur))
    this.v.pre.innerHTML = lines.slice(-14).join('\n') + (idle && !st.hideprompt ? `\n<span class="g">PS ${cwd}&gt;</span> <span class="car"></span>` : '')
    // explorer
    this.v.ex.innerHTML = st.tree ? `<div class="rt">▾ Busin.New</div><div class="tr">${spec.tree.map(([n, d, sel]) => `<div class="${sel && st.active === n ? 'sel' : ''}" style="padding-left:${d ? 34 : 38}px">${d ? '▸ ' : ''}${n}</div>`).join('')}</div>` : `<div class="nf"><p>You have not yet opened a folder.</p><b>Open Folder</b><p>You can clone a repository locally.</p><b>Clone Repository</b></div>`
    // editor
    this.v.tab.innerHTML = st.tabs.map(n => `<div class="${n === st.active ? 'on' : ''}">${n}</div>`).join('')
    const body = st.code.map((l, i) => `<div><span class="n">${i + 1}</span>${l}</div>`).join('')
    this.v.code.innerHTML = body || `<div style="position:absolute;inset:36px 0 0;display:grid;place-items:center;color:#4a4a4a;font:600 56px Inter;letter-spacing:-.04em">OpenLobs</div>`
    this.v.win.style.display = st.browser ? 'none' : 'block'; this.v.br.style.display = st.browser ? 'block' : 'none'; this.v.br.style.opacity = clamp((st.brt || 0) / .6)
    this.v.tt.textContent = st.title
    // caption
    const cp = caps.find(x => T >= x.a && T < x.b)
    if (cp) { const q = clamp(seg(T, cp.a, cp.a + .35)), o = seg(T, cp.b - .3, cp.b); this.cap.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#09f;margin-right:22px;vertical-align:12px;box-shadow:0 0 20px #09f"></span>' + cp.text; this.cap.style.opacity = q * (1 - o); this.cap.style.transform = `translateY(${(1 - eo5(q)) * 24}px)` } else this.cap.style.opacity = 0
  } }
}

}}
